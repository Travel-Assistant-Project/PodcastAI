services:
  podcast-db:
    image: postgres:15-alpine
    container_name: podcast_postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME:-podcast_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in backend/PodcastAPI/.env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - podcast-network

  podcast-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podcast_net_backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_HOST: podcast-db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-podcast_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:?Set DB_PASS in backend/PodcastAPI/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/PodcastAPI/.env}
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?Set AI_SERVICE_SECRET in backend/PodcastAPI/.env}
      AI_SERVICE_URL: ${AI_SERVICE_URL:?Set AI_SERVICE_URL in backend/PodcastAPI/.env}
      LISTEN_NOTES_API_KEY: ${LISTEN_NOTES_API_KEY:-}
    ports:
      - "5193:8080"
    networks:
      - podcast-network

volumes:
  pgdata:

networks:
  podcast-network:
    driver: bridge
